name: mailscan

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - models:/root/.ollama
    # No published ports: Ollama is reachable only inside the compose network
    mem_limit: 10g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # One-shot: pull the model if it's missing. If it's already there, no internet access happens
  ollama-pull:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    entrypoint: ["/bin/sh", "-c", "ollama show \"$$MODEL\" >/dev/null 2>&1 || ollama pull \"$$MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *logging

  mailscan:
    build: .
    image: mailscan:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      TZ: ${TZ:-Asia/Nicosia}
    volumes:
      - data:/app/data
      # The mailboxes and their passwords. Without the file compose refuses to start the service
      # rather than making a directory of that name.
      - type: bind
        source: ./mailboxes.yaml
        target: /app/mailboxes.yaml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    logging: *logging

volumes:
  models:
    # For the laptop test: OLLAMA_VOLUME=ollama reuses the already downloaded models
    name: ${OLLAMA_VOLUME:-mailscan-ollama}
  data:
    name: mailscan-data
